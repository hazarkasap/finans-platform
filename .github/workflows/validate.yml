name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: finance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U demo -d finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://demo:test-only-password@127.0.0.1:5432/finance_test
      AUTH_URL: http://127.0.0.1:3000
      AUTH_SECRET: test-only-auth-value-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: RUN_DATABASE_TESTS=true npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: ALLOW_SYNTHETIC_SEED=true npm run db:seed
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finance-portfolio-screenshots
          path: test-results/portfolio-screenshots
          if-no-files-found: error
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - run: bash scripts/scan_repository.sh
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.3
        with:
          args: detect --source=/github/workspace --no-git --redact --no-banner
